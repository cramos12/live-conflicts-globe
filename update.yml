name: Update conflict feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build points.json from GDELT
        run: python update_feed.py
      - name: Commit if changed
        run: |
          git config user.name "feed-robot"
          git config user.email "actions@github.com"
          git add points.json
          git diff --cached --quiet || git commit -m "Feed update"
          git push
